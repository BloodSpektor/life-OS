version: '3.8'

services:
  # NestJS API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: life-os-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=your-secret-key-change-in-production
      - JWT_EXPIRES_IN=7d
      - PORT=3001
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./apps/api/prisma:/app/apps/api/prisma
      - api-data:/app/apps/api
    networks:
      - life-os-network
    restart: unless-stopped

  # Next.js Web App
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: life-os-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:3001
      - NEXT_PUBLIC_NOTIFICATIONS_URL=http://notifications:3002
    depends_on:
      - api
      - notifications
    networks:
      - life-os-network
    restart: unless-stopped

  # Go Notifications Service
  notifications:
    build:
      context: ./services/notifications-service
      dockerfile: Dockerfile
    container_name: life-os-notifications
    ports:
      - "3002:3002"
    volumes:
      - notifications-data:/root
    networks:
      - life-os-network
    restart: unless-stopped

volumes:
  api-data:
  notifications-data:

networks:
  life-os-network:
    driver: bridge
